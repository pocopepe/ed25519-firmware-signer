[package]
name = "binsign-core"
version = "1.0.0"
edition = "2021"
authors = ["pocopepe <avijusanjai@gmail.com>"]
description = "Core signing, verification, and manifest logic for binsign."
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
chrono = { version = "0.4.41", features = ["serde"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8.5"
rpassword = "7.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typenum = "1.18.0"
zeroize = { version = "1.7", features = ["std"] }
