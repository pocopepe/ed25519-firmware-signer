[tasks.build-release]
description = "Builds the release binary for the native system."
command = "cargo"
args = ["build", "--release"]

[tasks.build-linux-x86_64]
description = "Builds the release binary for Linux x86_64 using cross."
command = "cross"
args = ["build", "--release", "--target", "x86_64-unknown-linux-gnu"]

[tasks.build-windows-x86_64]
description = "Builds the release binary for Windows x86_64 (MSVC ABI) using cross."
command = "cross"
args = ["build", "--release", "--target", "x86_64-pc-windows-msvc"]

[tasks.package-deb]
description = "Creates a Debian (.deb) package."
dependencies = ["build-linux-x86_64"]
command = "cargo"
args = ["deb"]

[tasks.package-rpm]
description = "Creates a Red Hat (.rpm) package."
dependencies = ["build-linux-x86_64"]
command = "cargo"
args = ["rpm", "build"]

[tasks.package-aur]
description = "Prepares files for an Arch Linux (AUR) package. (PKGBUILD, etc.)"
dependencies = ["build-linux-x86_64"]
command = "cargo"
args = ["aur"]

[tasks.bundle-windows]
description = "Creates a ZIP archive for Windows."
dependencies = ["build-windows-x86_64"]
script = '''
    # Create a directory for bundled releases if it doesn't exist
    mkdir -p target/release/dist

    # Path to the compiled Windows executable
    WIN_EXE_PATH="target/x86_64-pc-windows-msvc/release/{{CARGO_PKG_NAME}}.exe" # <-- Use CARGO_PKG_NAME
    # Destination ZIP file name
    ZIP_FILE="target/release/dist/{{CARGO_PKG_NAME}}-x86_64-windows.zip"     # <-- Use CARGO_PKG_NAME

    zip -j "${ZIP_FILE}" "${WIN_EXE_PATH}"

    echo "Windows bundle created: ${ZIP_FILE}"
'''


[tasks.bump-patch]
description = "Bumps the patch version (e.g., 0.2.0 -> 0.2.1), creates Git tag, and commits."
command = "cargo"
args = ["release", "patch", "--no-publish", "--execute"] # <--- ADD --execute

[tasks.bump-minor]
description = "Bumps the minor version (e.g., 0.2.0 -> 0.3.0), creates Git tag, and commits."
command = "cargo"
args = ["release", "minor", "--no-publish", "--execute"] # <--- ADD --execute

[tasks.bump-major]
description = "Bumps the major version (e.g., 0.2.0 -> 1.0.0), creates Git tag, and commits."
command = "cargo"
args = ["release", "major", "--no-publish", "--execute"] # <--- ADD --execute

[tasks.release-patch]
description = "Performs a full PATCH release: bumps patch, builds, and packages for multiple platforms."
dependencies = [
    "bump-patch",
    "package-deb",
    "package-rpm",
    "package-aur",
    "bundle-windows"
]

[tasks.release-minor]
description = "Performs a full MINOR release: bumps minor, builds, and packages for multiple platforms."
dependencies = [
    "bump-minor",
    "package-deb",
    "package-rpm",
    "package-aur",
    "bundle-windows"
]

[tasks.release-major]
description = "Performs a full MAJOR release: bumps major, builds, and packages for multiple platforms."
dependencies = [
    "bump-major",
    "package-deb",
    "package-rpm",
    "package-aur",
    "bundle-windows"
]

# Optional: A default 'release' task that you can map to your most common release type
[tasks.release]
description = "Alias for 'release-minor' (the default full release)."
dependencies = ["release-minor"]